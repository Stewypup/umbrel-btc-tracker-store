manifestVersion: 1
id: mystore-btc-tracker
category: bitcoin
name: Cold Storage Tracker
version: "1.2.0"
tagline: Track your cold storage Bitcoin holdings over time

description: >
  A private, self-hosted dashboard that tracks your cold storage Bitcoin wallets
  using your local Fulcrum server. Enter your xpub/zpub keys, and the app will
  derive all addresses, fetch your full transaction history from the blockchain,
  and chart your total portfolio value in USD over time using daily BTC price
  data from CoinGecko.

  All data stays on your Umbrel — no third parties ever see your wallet addresses
  or balances.

developer: Self-hosted
website: https://github.com/stewypup/umbrel-btc-tracker-store
repo: https://github.com/stewypup/umbrel-btc-tracker-store
support: https://github.com/stewypup/umbrel-btc-tracker-store/issues
submitter: stewypup
submission: https://github.com/stewypup/umbrel-btc-tracker-store

#dependencies:
#  - fulcrum

releaseNotes: >-
  Wallet cards show balances in sats. Wallets can be marked obsolete on the
  Manage Wallets page and hidden on the dashboard while still counting in
  your cost basis. New Total Invested card with your average purchase price.
  The portfolio chart now shows purchase markers and can be zoomed (range
  buttons, drag or scroll). Removed the BTC Held Over Time chart.

port: 4567

