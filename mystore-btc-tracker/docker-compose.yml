version: "3.7"

services:
  web:
    image: ghcr.io/stewypup/btc-tracker:latest
    restart: unless-stopped
    init: true
    ports:
      - "4567:5000"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    environment:
      # Fulcrum Electrum TCP connection. Uses Umbrel's exported values when
      # available, otherwise Fulcrum's fixed Umbrel address and port.
      ELECTRUM_HOST: "${APP_FULCRUM_NODE_IP:-10.21.21.200}"
      ELECTRUM_PORT: "${APP_FULCRUM_NODE_PORT:-50002}"
      # Flask secret key — Umbrel provides a unique seed per app
      SECRET_KEY: "${APP_SEED}"
      # SQLite database path (inside the /data volume)
      DB_PATH: "/data/btc_tracker.db"
